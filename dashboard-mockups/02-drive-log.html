<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DriveTrace — Logbook</title>
<style>
:root{
  --ink:#06090E; --panel:#0D131B; --panel-raised:#141C26; --panel-active:#1A2431;
  --hairline:#202B39; --hairline-bright:#33455A;
  --chalk:#F2F6FA; --mist:#9AA9BA; --ash:#7C8B9E; --slate:#4A5768;
  --mixture:#2ED3C6; --caution:#FFC53D; --fault:#FF4D4F; --live:#31C56A;
}
*{box-sizing:border-box;}
html,body{background:var(--ink);color:var(--chalk);margin:0;padding:0;
  font-family:'Roboto','Segoe UI',system-ui,sans-serif;height:100%;}
.tnum{font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;}
header.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid var(--hairline);}
.wordmark{font-weight:700;font-size:18px;letter-spacing:3.5px;color:var(--chalk);}
.wordmark span{color:var(--mixture);}
.hdr-sub{color:var(--ash);font-size:12px;}

.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 53px);}
.rail{border-right:1px solid var(--hairline);display:flex;flex-direction:column;overflow:hidden;}
.trend-strip{padding:16px 18px;border-bottom:1px solid var(--hairline);}
.trend-strip .tlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ash);font-weight:700;margin-bottom:6px;}
.trend-strip svg{width:100%;height:44px;display:block;margin-bottom:14px;}
.trend-strip .tval{font-size:13px;color:var(--mist);margin-top:-8px;margin-bottom:14px;}
.filter-row{padding:10px 18px;display:flex;gap:6px;border-bottom:1px solid var(--hairline);}
.chip{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--hairline);
  color:var(--ash);cursor:pointer;font-weight:600;}
.chip.active{color:var(--ink);background:var(--mixture);border-color:var(--mixture);}
.log-list{overflow-y:auto;flex:1;}
.card{padding:12px 18px;border-bottom:1px solid var(--hairline);cursor:pointer;position:relative;}
.card:hover{background:var(--panel-raised);}
.card.selected{background:var(--panel-active);}
.card.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mixture);}
.card-top{display:flex;justify-content:space-between;align-items:baseline;}
.card-date{font-size:12.5px;font-weight:600;color:var(--chalk);}
.card-veh{font-size:10.5px;color:var(--slate);}
.card-mid{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;}
.card-mpg{font-size:20px;font-weight:300;color:var(--chalk);}
.card-mpg .u{font-size:11px;color:var(--mist);font-weight:400;}
.card-trim{font-size:12.5px;font-weight:600;color:var(--mixture);display:flex;align-items:center;gap:5px;}
.card-trim .dot{width:6px;height:6px;border-radius:50%;background:var(--mixture);}
.card-meta{font-size:11px;color:var(--ash);margin-top:4px;}
.card-note{font-size:11px;color:var(--caution);margin-top:4px;font-style:italic;}

.detail{overflow-y:auto;padding:26px 34px 60px;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.detail-head h1{font-size:22px;font-weight:600;margin:0 0 4px;}
.detail-head .sub{color:var(--ash);font-size:13px;}
.hero-row{display:flex;gap:14px;margin-bottom:22px;}
.hero{flex:1;background:var(--panel);border:1px solid var(--hairline);border-radius:14px;padding:18px 20px;}
.hero .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ash);font-weight:700;}
.hero .v{font-size:40px;font-weight:300;margin-top:6px;}
.hero .v .u{font-size:14px;color:var(--mist);margin-left:6px;font-weight:500;}
.hero.mix{border-color:var(--hairline);}
.hero.mix::before{content:'';display:block;height:3px;background:var(--mixture);border-radius:3px;margin:-19px -21px 14px;}
.section-label{display:flex;align-items:center;gap:10px;margin:26px 0 12px;
  text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--ash);}
.section-label::after{content:'';flex:1;height:1px;background:var(--hairline);}
.panel{background:var(--panel);border:1px solid var(--hairline);border-radius:14px;padding:18px 20px;}
table.phase{width:100%;border-collapse:collapse;font-size:13px;}
table.phase th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ash);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--hairline);}
table.phase td{padding:8px;border-bottom:1px solid var(--hairline);color:var(--mist);}
table.phase td.chalk{color:var(--chalk);font-weight:500;}
table.phase td.num{text-align:right;}
.split-row{display:flex;gap:14px;margin-top:4px;}
.split{flex:1;background:var(--panel-raised);border-radius:10px;padding:12px 14px;}
.split .lbl{font-size:10.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.8px;font-weight:700;}
.split .v{font-size:20px;font-weight:400;margin-top:4px;}
.flag{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--hairline);
  background:var(--panel-raised);font-size:12.5px;color:var(--mist);line-height:1.5;margin-top:8px;}
.flag .glyph{color:var(--caution);font-weight:700;flex-shrink:0;}
.note-box{background:var(--panel-raised);border-left:3px solid var(--caution);border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:13px;color:var(--mist);margin-top:16px;}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-thumb{background:var(--hairline-bright);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('drive-data').textContent);
const drives = [...DATA.drives].reverse(); // most recent first
let selectedId = drives[0].session_id;
let filter = 'all';

function shortVeh(v){ return v.replace('2020 ','').replace('2014 ',''); }

function sparkline(el, points, color, zero){
  const W=300,H=44,pad=4;
  const ys = points.map(p=>p);
  let yMin=Math.min(...ys), yMax=Math.max(...ys);
  if(zero){ yMin=Math.min(yMin,0); yMax=Math.max(yMax,0); }
  const p = (yMax-yMin)*0.15||1; const y0=yMin-p, y1=yMax+p;
  const xAt = i => pad + (i/(points.length-1))*(W-2*pad);
  const yAt = v => pad + (H-2*pad) - ((v-y0)/(y1-y0))*(H-2*pad);
  let d = points.map((v,i)=>(i===0?'M':'L')+xAt(i).toFixed(1)+','+yAt(v).toFixed(1)).join(' ');
  let svg = '';
  if(zero){ svg += `<line x1="${pad}" y1="${yAt(0).toFixed(1)}" x2="${W-pad}" y2="${yAt(0).toFixed(1)}" stroke="#202B39" stroke-dasharray="3,3"/>`; }
  svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  el.setAttribute('viewBox',`0 0 ${W} ${H}`);
  el.innerHTML = svg;
}
const mpgSeries = [...DATA.drives].map(d=>d.mpg);
const trimSeries = [...DATA.drives].map(d=>d.trim);
sparkline(document.getElementById('sparkMpg'), mpgSeries, '#2ED3C6', false);
sparkline(document.getElementById('sparkTrim'), trimSeries, '#2ED3C6', true);
document.getElementById('sparkMpgLabel').textContent = mpgSeries[mpgSeries.length-1].toFixed(1)+' mpg latest · avg '+(mpgSeries.reduce((a,b)=>a+b,0)/mpgSeries.length).toFixed(1);
document.getElementById('sparkTrimLabel').textContent = (trimSeries[trimSeries.length-1]>0?'+':'')+trimSeries[trimSeries.length-1].toFixed(1)+'% latest · avg '+(trimSeries.reduce((a,b)=>a+b,0)/trimSeries.length>0?'+':'')+(trimSeries.reduce((a,b)=>a+b,0)/trimSeries.length).toFixed(1)+'%';

function matchesFilter(d){
  if(filter==='all') return true;
  if(filter==='mazda') return d.vehicle.includes('Mazda');
  if(filter==='subaru') return d.vehicle.includes('Subaru');
  if(filter==='notes') return !!d.notes;
  return true;
}

function renderList(){
  const list = document.getElementById('logList');
  const visible = drives.filter(matchesFilter);
  list.innerHTML = visible.map(d=>`
    <div class="card ${d.session_id===selectedId?'selected':''}" data-id="${d.session_id}">
      <div class="card-top">
        <span class="card-date tnum">${d.date}</span>
        <span class="card-veh">${shortVeh(d.vehicle)}</span>
      </div>
      <div class="card-mid">
        <span class="card-mpg tnum">${d.mpg.toFixed(1)}<span class="u"> mpg</span></span>
        <span class="card-trim tnum"><span class="dot"></span>${d.trim>0?'+':''}${d.trim.toFixed(1)}%</span>
      </div>
      <div class="card-meta tnum">${d.dist_km.toFixed(1)} km · idle ${d.idle_pct.toFixed(0)}% · ${d.cruise_windows} cruise windows</div>
      ${d.notes ? `<div class="card-note">"${d.notes}"</div>` : ''}
    </div>
  `).join('');
  list.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=>{ selectedId = Number(c.dataset.id); renderList(); renderDetail(); });
  });
}

function renderDetail(){
  const d = drives.find(x=>x.session_id===selectedId);
  const el = document.getElementById('detail');
  const phaseRows = d.phases.map(p=>`
    <tr><td class="chalk">${p.phase}</td><td class="num">${p.rpm.toFixed(0)}</td><td class="num">${p.load_pct.toFixed(1)}%</td>
    <td class="num">${p.maf_gs.toFixed(1)} g/s</td><td class="num chalk">${p.combined_trim_pct!=null?(p.combined_trim_pct>0?'+':'')+p.combined_trim_pct.toFixed(1)+'%':'—'}</td></tr>
  `).join('');

  let flags = [];
  if(Math.abs(d.trim) > 10) flags.push(`Combined trim ${d.trim>0?'averages +':'averages '}${d.trim.toFixed(1)}% during this drive — consistent with unmetered air, MAF under-reporting, or a fuel-delivery shortfall. Not a diagnosis on its own.`);
  else flags.push(`No threshold-based flags triggered (anomaly_flags() fires above ±10% cruise trim). That doesn't rule out a subtler issue — this drive still sits on the positive side, consistent with the broader trend.`);
  if(d.idle_pct > 40) flags.push(`Idle fraction ${d.idle_pct.toFixed(0)}% is high for this drive — traffic/idle time pulls trip MPG down independent of any mechanical issue.`);
  if(d.warmup_min > 10) flags.push(`Warm-up took ${d.warmup_min.toFixed(1)} min to plateau, longer than typical — worth watching if it recurs.`);

  el.innerHTML = `
    <div class="detail-head">
      <div>
        <h1 class="tnum">${d.datetime}</h1>
        <div class="sub">${d.vehicle} · session ${d.session_id} · ${d.dist_km.toFixed(2)} km GPS distance</div>
      </div>
    </div>
    ${d.notes ? `<div class="note-box">Driver note: "${d.notes}"</div>` : ''}
    <div class="hero-row">
      <div class="hero mix">
        <div class="lbl">Overall MPG</div>
        <div class="v tnum">${d.mpg.toFixed(1)}<span class="u">mpg</span></div>
      </div>
      <div class="hero mix">
        <div class="lbl">Combined trim (STFT+LTFT)</div>
        <div class="v tnum">${d.trim>0?'+':''}${d.trim.toFixed(1)}<span class="u">%</span></div>
      </div>
      <div class="hero">
        <div class="lbl">Idle fraction</div>
        <div class="v tnum">${d.idle_pct.toFixed(0)}<span class="u">%</span></div>
      </div>
    </div>

    <div class="section-label">Trim split</div>
    <div class="split-row">
      <div class="split"><div class="lbl">Idle</div><div class="v tnum">${d.trim_idle!=null?(d.trim_idle>0?'+':'')+d.trim_idle.toFixed(1)+'%':'—'}</div></div>
      <div class="split"><div class="lbl">Moving</div><div class="v tnum">${d.trim_moving!=null?(d.trim_moving>0?'+':'')+d.trim_moving.toFixed(1)+'%':'—'}</div></div>
      <div class="split"><div class="lbl">LTFT alone</div><div class="v tnum">${d.ltft!=null?(d.ltft>0?'+':'')+d.ltft.toFixed(1)+'%':'—'}</div></div>
      <div class="split"><div class="lbl">Knock retard</div><div class="v tnum">${d.knock_deg!=null?d.knock_deg.toFixed(2)+'°':'—'}</div></div>
    </div>

    <div class="section-label">Phase breakdown</div>
    <div class="panel">
      <table class="phase tnum">
        <thead><tr><th>Phase</th><th>Mean RPM</th><th>Mean load</th><th>Mean MAF</th><th>Combined trim</th></tr></thead>
        <tbody>${phaseRows}</tbody>
      </table>
    </div>

    <div class="section-label">Anomaly flags</div>
    <div>${flags.map(f=>`<div class="flag"><span class="glyph">!</span><span>${f}</span></div>`).join('')}</div>
  `;
}

document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    filter = c.dataset.filter;
    renderList();
  });
});

renderList();
renderDetail();
</script>
</body>
</html>
